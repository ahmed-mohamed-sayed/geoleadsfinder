<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoLeadsFinder.com — Premium Domain for Sale</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a192f, #112240);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      text-align: center;
      padding: 50px 60px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    .logo {
      width: 100%;
      max-width: 800px;
      height: auto;
      margin: 0 auto 30px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      background: linear-gradient(to right, #ffffff, #64c5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #ccd6f6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .cta-button {
      padding: 15px 35px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
    }

    .sedo-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
    }

    .sedo-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 7px 20px rgba(0, 114, 255, 0.6);
      background: linear-gradient(45deg, #00bfff, #0066e0);
    }

    .afternic-btn {
      background: linear-gradient(45deg, #00C853, #009640);
      box-shadow: 0 5px 15px rgba(0, 200, 83, 0.4);
    }

    .afternic-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 7px 20px rgba(0, 200, 83, 0.6);
      background: linear-gradient(45deg, #00B84A, #008036);
    }

    @media (max-width: 1024px) {
      .container {
        max-width: 800px;
        padding: 40px 30px;
      }
      .logo {
        max-width: 720px;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
        max-width: 100%;
      }
      h1 {
        font-size: 2.2rem;
      }
      .logo {
        max-width: 100%;
      }
      .cta-button {
        padding: 12px 28px;
        font-size: 1rem;
        min-width: 180px;
      }
      .buttons {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SVG Logo — NOW WITHOUT ".COM" -->
    <svg class="logo" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 720 220"
         width="720" height="220"
         role="img" aria-labelledby="glfTitle glfDesc">
      <title id="glfTitle">GeoLeadsFinder logo</title>
      <desc id="glfDesc">Globe with target pin and magnifying glass, wordmark GEOLEADSFINDER</desc>

      <defs>
        <style>
          :root { --geo-blue: #0A66D6; --teal: #00C6FF; }
          .geo-fill { fill: var(--geo-blue); }
          .teal-fill { fill: var(--teal); }
          .word {
            fill: var(--geo-blue);
            font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
            font-weight: 700;
            font-size: 52px; /* slightly larger now that .COM is gone */
            letter-spacing: -0.5px;
          }
        </style>

        <linearGradient id="g1" x1="0" x2="1">
          <stop offset="0" stop-color="#0A66D6" stop-opacity="1"/>
          <stop offset="1" stop-color="#00C6FF" stop-opacity="1"/>
        </linearGradient>
      </defs>

      <!-- Globe base -->
      <circle cx="110" cy="110" r="70" fill="none" stroke="url(#g1)" stroke-width="8"/>

      <!-- Latitude/longitude lines -->
      <path d="M 40 110 Q 110 80 180 110 Q 110 140 40 110" fill="none" stroke="rgba(0,198,255,0.3)" stroke-width="3"/>
      <path d="M 110 40 Q 140 110 110 180 Q 80 110 110 40" fill="none" stroke="rgba(0,198,255,0.3)" stroke-width="3"/>

      <!-- Target Pin (Leads) -->
      <g transform="translate(110,110)">
        <rect x="-6" y="-30" width="12" height="40" rx="2" class="teal-fill"/>
        <polygon points="0,-30 -8,-45 8,-45" class="teal-fill"/>
        <circle cx="0" cy="-45" r="8" class="teal-fill"/>
        <circle cx="0" cy="-45" r="10" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
      </g>

      <!-- Magnifying Glass (Finder) -->
      <g transform="translate(180,100)">
        <circle cx="0" cy="0" r="20" fill="none" stroke="var(--geo-blue)" stroke-width="4"/>
        <line x1="15" y1="15" x2="30" y2="30" stroke="var(--geo-blue)" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Wordmark — ONLY "GEOLEADSFINDER" -->
      <g transform="translate(280,110)">
        <text x="0" y="12" class="word">GEOLEADSFINDER</text>
      </g>

      <rect x="0" y="0" width="720" height="220" fill="none"/>
    </svg>

    <h1>Own GeoLeadsFinder.com</h1>
    <p>A powerful, geo-targeting domain ideal for lead generation, real estate tech, local marketing, CRM tools, or B2B sales platforms. Instantly communicates precision and location-based intelligence.</p>

    <div class="buttons">
      <a href="https://sedo.com/search/details/?domain=geoleadsfinder.com&origin=domaindetails" target="_blank" class="cta-button sedo-btn">Buy on Sedo</a>
      <a href="https://www.afternic.com/domains/geoleadsfinder.com" target="_blank" class="cta-button afternic-btn">Buy on Afternic</a>
    </div>
  </div>
</body>
</html>
